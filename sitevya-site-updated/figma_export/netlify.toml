[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Routes React Router (/services, /contact, /dashboard...) -> index.html
# (n'affecte pas les fichiers réels ni /.netlify/functions/*)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
